<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administración | Cora Confecciones</title>

    <link
        rel="stylesheet"
        href="/css/admin.css"
    >
</head>

<body class="body-login">

    <main class="login-contenedor">

        <section class="login-marca">

            <img
                src="/img/logocora.jpeg"
                alt="Cora Confecciones"
                class="login-logo"
            >

            <p>
                Gestión de Cora Confecciones
            </p>

        </section>


        <section class="login-caja">

            <p class="mini-titulo">
                ADMINISTRACIÓN
            </p>

            <h1>
                Iniciar sesión
            </h1>

            <p class="login-descripcion">
                Ingresá tus datos para acceder
                al panel administrador.
            </p>


            <form id="form-login">

                <div class="campo-admin">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        placeholder="Ingresá tu usuario"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="campo-admin">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Ingresá tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <p
                    id="mensaje"
                    class="mensaje-error"
                ></p>


                <button
                    type="submit"
                    class="btn-principal"
                >
                    Ingresar
                    <span>→</span>
                </button>

            </form>


            <a
                href="/"
                class="volver-web"
            >
                ← Volver a Cora Confecciones
            </a>

        </section>

    </main>


    <script src="/js/login.js"></script>

</body>

</html>
